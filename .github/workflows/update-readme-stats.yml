name: Update README cards

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-readme-stats.yml"

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Check out original trophy generator
        uses: actions/checkout@v6
        with:
          repository: ryo-ma/github-profile-trophy
          ref: e3c89df995e92e67cdd4b2acaab9d974583dc1f7
          path: .trophy-generator
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Generate trophy card
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sed -i 's/const maxRow = 10;/const maxRow = 2;/' .trophy-generator/render_svg.ts
          sed -i 's/const maxColumn = -1; \/\/ auto/const maxColumn = 5;/' .trophy-generator/render_svg.ts
          deno run --allow-net --allow-env --allow-read --allow-write \
            .trophy-generator/render_svg.ts \
            "${{ github.repository_owner }}" \
            "profile/trophy.svg" \
            "default"

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&include_all_commits=true&theme=light_github
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&langs_count=10&layout=compact
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Refresh README card URLs
        run: |
          cache_bust="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sed -Ei "s#(\./profile/(trophy|stats|top-langs)\.svg)(\?v=[^\" ]*)?#\1?v=${cache_bust}#g" README.md

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
